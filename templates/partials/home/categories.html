<section class="cats" aria-label="Категорії">
  <div class="cat-rail">
    {% for cat in categories %}
      <a class="cat-card" href="{{ cat.get_absolute_url }}">
        <span class="cat-card__media">
          {% if cat.image %}<img src="{{ cat.image.url }}" alt="" width="303" height="342">{% endif %}
        </span>
        <span class="cat-card__name">{{ cat.name }}</span>
      </a>
    {% endfor %}
  </div>
</section>

{% load i18n static %}
<div class="filter-panel__options">
  <section class="filter-sec">
    <h2>{% trans "Категорії" %}</h2>
    <div class="filter-sec__opts">
      {% for category in filter_categories %}
        <label class="filter-opt">
          <input type="checkbox" name="category" value="{{ category.slug }}"{% if category.slug in parsed.categories %} checked{% endif %}>
          <img class="filter-dot filter-dot--desk" src="{% static 'figma/v2/filters/f47a7.svg' %}" width="14" height="14" alt="">
          <img class="filter-dot filter-dot--mob" src="{% static 'figma/v2/filters/9f40c.svg' %}" width="16" height="16" alt="">
          <span>{{ category.filter_label }}</span>
        </label>
      {% endfor %}
    </div>
  </section>
  {% for group in filter_groups %}
    <div class="filter-rule" aria-hidden="true">
      <img class="rule-desk" src="{% static 'figma/v2/filters/40433.svg' %}" width="243" height="1" alt="">
      <img class="rule-mob" src="{% static 'figma/v2/filters/83b43.svg' %}" width="322" height="1" alt="">
    </div>
    <section class="filter-sec">
      <h2>{{ group.group.name }}</h2>
      <div class="filter-sec__opts">
        {% for value in group.values %}
          {% with mark=group.group.slug|add:":"|add:value.slug %}
            <label class="filter-opt">
              <input type="checkbox" name="{{ group.group.slug }}" value="{{ value.slug }}"{% if mark in parsed.selected %} checked{% endif %}>
              <img class="filter-dot filter-dot--desk" src="{% static 'figma/v2/filters/f47a7.svg' %}" width="14" height="14" alt="">
              <img class="filter-dot filter-dot--mob" src="{% static 'figma/v2/filters/9f40c.svg' %}" width="16" height="16" alt="">
              <span>{{ value.name }}</span>
            </label>
          {% endwith %}
        {% endfor %}
      </div>
    </section>
  {% endfor %}
</div>

{% load shop_tags %}
<a class="pdp-card is-{{ item.card_crop }}" href="{{ item.get_absolute_url }}" style="--name-w: {{ item.name_width }}px">
  <span class="pdp-card__media">
    {% if item.card_photo_url %}
      <img src="{{ item.card_photo_url }}" alt="" width="368" height="415">
    {% endif %}
  </span>
  <span class="pdp-card__meta">
    <span class="pdp-card__name">{{ item.name }}</span>
    <span class="pdp-card__price{% if item.price_weight == 500 %} is-medium{% endif %}">{% home_price item %}</span>
  </span>
</a>

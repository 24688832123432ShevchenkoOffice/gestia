<a class="catalog-cell catalog-cell--{{ cell.role }} is-{{ cell.crop }}" href="{{ cell.product.get_absolute_url }}" style="--name-w: {{ cell.name_width }}px">
  <span class="catalog-cell__media">
    {% if cell.photo_url %}
      <img src="{{ cell.photo_url }}" alt="" width="{% if cell.role == 'feature' %}635{% else %}303{% endif %}" height="{% if cell.role == 'feature' %}770{% else %}342{% endif %}">
    {% endif %}
  </span>
  <span class="catalog-cell__meta">
    <span class="catalog-cell__name">{{ cell.product.name }}</span>
    <span class="catalog-cell__price">{{ cell.price_label }}</span>
  </span>
</a>

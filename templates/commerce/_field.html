<label class="field{% if field.errors %} is-invalid{% endif %}" data-field-wrap>
  <span class="field__label">{{ field.label }}</span>
  {{ field }}
  <span class="field__error" data-error-for="{{ field.name }}" data-field-error{% if not field.errors %} hidden{% endif %}>{% if field.errors %}{{ field.errors|striptags }}{% endif %}</span>
</label>

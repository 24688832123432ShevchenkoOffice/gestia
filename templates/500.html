<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>500 · Gestia</title>
  <meta name="robots" content="noindex,follow">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f3eee6;
      color: #241c16;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-text-size-adjust: 100%;
    }

    main {
      box-sizing: border-box;
      width: min(28rem, calc(100% - 32px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
      margin: 0 auto;
      padding: calc(24px + env(safe-area-inset-top, 0px)) 0 calc(24px + env(safe-area-inset-bottom, 0px));
      text-align: center;
    }

    .code,
    h1,
    p {
      margin: 0;
    }

    .code {
      margin-bottom: 12px;
      color: #8d3b2a;
      font-size: 64px;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    h1 {
      margin-bottom: 12px;
      font-size: 32px;
      font-weight: 500;
      line-height: 1.15;
      letter-spacing: -0.03em;
    }

    .text {
      margin-bottom: 8px;
      font-size: 16px;
      line-height: 1.45;
    }

    .en {
      margin-bottom: 24px;
      font-size: 16px;
      line-height: 1.45;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      padding: 12px 20px;
      background: #241c16;
      color: #f3eee6;
      font-size: 16px;
      line-height: 1.2;
      text-decoration: none;
    }

    @media (max-width: 374px) {
      .code {
        font-size: 52px;
      }

      h1 {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <main>
    <p class="code">500</p>
    <h1>Щось пішло не так</h1>
    <p class="text">Спробуйте оновити сторінку або поверніться на головну.</p>
    <p class="en" lang="en">Something went wrong. Refresh the page or go back home.</p>
    <a href="/">На головну · Home</a>
  </main>
</body>
</html>

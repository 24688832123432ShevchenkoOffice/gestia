{% load i18n static %}
<!DOCTYPE html>
<html lang="{{ LANGUAGE_CODE }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="csrf-token" content="{{ csrf_token }}">
  <meta name="theme-color" content="#ffffff">
  <title>{% block title %}Gestia{% endblock %}</title>
  <meta name="description" content="{% block description %}{% endblock %}">
  {% for code, url in lang_switch_urls.items %}
    <link rel="alternate" hreflang="{{ code }}" href="{{ request.scheme }}://{{ request.get_host }}{{ url }}">
  {% endfor %}
  <link rel="icon" href="{% static 'images/favicon.ico' %}" sizes="any">
  <link rel="icon" href="{% static 'images/favicon.png' %}" type="image/png">
  <link rel="apple-touch-icon" href="{% static 'images/apple-touch-icon.png' %}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100;400;500&display=swap">
  <link rel="stylesheet" href="{% static 'css/variables.css' %}">
  <link rel="stylesheet" href="{% static 'css/reset.css' %}">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  <link rel="stylesheet" href="{% static 'css/layout.css' %}">
  <link rel="stylesheet" href="{% static 'css/figma/tokens.css' %}">
  <link rel="stylesheet" href="{% static 'css/figma/header.css' %}">
  <link rel="stylesheet" href="{% static 'css/figma/header-menu.css' %}">
  <link rel="stylesheet" href="{% static 'css/figma/footer.css' %}">
  <link rel="stylesheet" href="{% static 'css/components/buttons.css' %}">
  <link rel="stylesheet" href="{% static 'css/components/forms.css' %}">
  <link rel="stylesheet" href="{% static 'css/components/cards.css' %}">
  <link rel="stylesheet" href="{% static 'css/components/modal.css' %}">
  <link rel="stylesheet" href="{% static 'css/components/crumbs.css' %}">
  <link rel="stylesheet" href="{% url 'theme_css' %}">
  {% block extra_css %}{% endblock %}
</head>
<body class="{% if request.resolver_match.url_name == 'home' %}page-home{% elif request.resolver_match.url_name == 'catalog' or request.resolver_match.url_name == 'category' %}page-catalog{% elif request.resolver_match.url_name == 'product' %}page-product{% elif request.resolver_match.url_name == 'cart' %}page-cart{% elif request.resolver_match.url_name == 'wishlist' %}page-wishlist{% elif request.resolver_match.url_name == 'checkout' %}page-checkout{% elif request.resolver_match.url_name == 'thanks' or request.resolver_match.url_name == 'thanks_legacy' %}page-thanks{% elif request.resolver_match.url_name == 'about' %}page-about{% elif request.resolver_match.url_name == 'privacy' or request.resolver_match.url_name == 'offer' or request.resolver_match.url_name == 'cookies' %}page-legal{% endif %}">
  {% include "partials/header.html" %}
  <main id="main">
    {% block content %}{% endblock %}
  </main>
  {% include "partials/footer.html" %}
  <script src="{% static 'js/vendor/htmx.min.js' %}" defer></script>
  <script src="{% static 'js/utils.js' %}" defer></script>
  <script src="{% static 'js/nav.js' %}" defer></script>
  <script src="{% static 'js/dialog.js' %}" defer></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
